{% macro csrf() %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% endmacro %}

{% macro logo(size=28) %}
<svg class="logo" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="dropGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8d5a8"/>
      <stop offset="1" stop-color="#c8a45d"/>
    </linearGradient>
  </defs>
  <path d="M12 2.5c3.6 4.4 6.5 7.7 6.5 11.2a6.5 6.5 0 0 1-13 0C5.5 10.2 8.4 6.9 12 2.5z" fill="url(#dropGrad)"/>
  <path d="M9 14.2a3.2 3.2 0 0 0 2.6 3.1" fill="none" stroke="#0a1b2e" stroke-opacity=".45" stroke-width="1.4" stroke-linecap="round"/>
</svg>
{% endmacro %}

{% macro dots(points, extra='') %}
<div class="dots {{ extra }}" role="img" aria-label="{{ points }} of {{ REWARD_AT }} refills collected">
  {% for i in range(1, REWARD_AT + 1) %}<span class="dot{{ ' on' if i <= points }}{{ ' gift' if i == REWARD_AT }}"></span>{% endfor %}
</div>
{% endmacro %}

{% macro stat(label, value, note='') %}
<div class="stat">
  <div class="stat-label">{{ label }}</div>
  <div class="stat-value">{{ value }}</div>
  {% if note %}<div class="stat-note">{{ note }}</div>{% endif %}
</div>
{% endmacro %}
